<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STIRAP Interactive Project</title>
    <link rel="stylesheet" href="scr/styles.css">
    <!--<script src="https://cdn.plot.ly/plotly-3.6.0.min.js" charset="uft-8"></script>--><!--Imports a graphing library-->
    <!--<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/3.3.0/math.min.js"></script><!--Imports a Javascript mathmatical library-->
</head>


<body>
    <div class="box">
        <div>
            <h1>
                 Time Parameters
            </h1>
            <input type="number" id="time0" step="1", min="0", max="100" placeholder="t0", value="0"><p> Initial Time (t0)</p>
            <input type="number" id="timef" step="1", min="0", max="100" placeholder="tf", value="60"><p> Final Time (tf)</p>
        </div>
        <div>
            <h1>
                 Position Parameters
            </h1>
            <input type="number" id="tp" step="1", min="0", max="100" placeholder="tp", value="20"><p> Position (tp)</p>
        </div>
        <div>
            <h1>
                 Angle Parameters In Radians
            </h1>
            <input type="range" id="beta", min="0", max="6.28318530718" placeholder="Enter", value=".2"> <p> Alpha(α)</p>
            <input type="range" id="alpha", min="0", max="6.28318530718" placeholder="Enter", value=".33"><p> Beta(β)</p>
        </div>   
    </div> 

    <button id="calculate">Calculate</button>

    <script src="scr/numeric.js"></script>
    <script src="scr/index.js"></script>
</body>
</html>
