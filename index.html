<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STIRAP Interactive Project</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="scr/styles.css">
    <script src="https://cdn.plot.ly/plotly-3.6.0.min.js" charset="utf-8"></script>
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/3.3.0/math.min.js"></script>
</head>
<body>
    <div class="box">
        <div class="parameters">
            <h2>Control Panel</h2>
            <hr>

            <div class="param-group">
                <h3>Laser Parameters</h3>
                <label>Detuning (eV): <span id="detuning0_Value">0</span></label>
                <input type="range" id="detuning0" step="0.1" min="-0.5" max="0.5" value="0">
                <label> Pulse Duration (fs): <span id='duration_Value'>12</span></label>
                <input type="range" id="duration" step="0.1" min="10" max="20" value="12">
            </div>

            <div class="param-group">
                <h3>Time Parameters</h3>
                <label>Initial Time (t0)</label>
                <input type="number" id="time0" step="1" min="0" value="0">
                
                <label>Final Time (tf)</label>
                <input type="number" id="timef" step="1" min="100" max="500" value="100">
                
                <label>Total Time: <span id="total_time_Value">100</span></label>
                <input type="range" id="total_time" step="1" min="0" max="100" value="100">
            </div>

            <div class="param-group">
                <h3>Position Parameters</h3>
                <label>Position (ts): <span id="t_s_Value">62</span></label>
                <input type="range" id="t_s" step="0.1" min="0" max="100" value="62">
            </div>

            <div class="param-group">
                <h3>Population Controls</h3>
                <label>C Initial: <span id="C0_Value">0.25</span></label>
                <input type="range" id="C0" step="0.01" min="0" max="1" value="0.25" class="slider"> 
                
                <label>C Final: <span id="CF_Value">0</span></label>
                <input type="range" id="CF" step="0.01" min="0" max="1" value="0" class="slider">
            </div>

            <div class="param-group toggle-group">
                <input type="checkbox" id="toggle_curves" checked>
                <label for="toggle_curves" style="cursor: pointer; font-weight: bold;">Show Frequency Pulse & RWA Curves</label>
            </div>
        </div> 

        <div class="graphs">
            <div class="first_line_graphs">
                <div id="plot" class="graph-container" style="width:100%; max-width:1000px; height:300px;"></div>
                <div id="plotII" class="graph-container" style="width:100%; max-width:1000px; height:300px;"></div>
            </div>
            <div class="second_line_graphs">
                <div id="energyPlot" class="graph-container large-graph"></div>
                <div id="plotIII" class="graph-container large-graph"></div>
            </div>
            
        </div>  
    </div>

    <script src="scr/numeric.js"></script>
    <script src="scr/index.js"></script>
</body>
</html>
